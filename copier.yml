# BIDS template collection: one copier template per dataset kind, chosen by `kind`.
# A ma-DMP pins every dataset of a study to the same repository and tag, e.g.
#   "template": {"repository": "<this repo>", "version": "v0.1.0", "data": {"kind": "fmriprep"}}
# Changing `kind` of an existing dataset is a non-additive edit that faire refuses.
_subdirectory: "{{ kind }}"
_answers_file: .copier-answers.yml

kind:
  type: str
  help: Dataset kind to render
  choices: [dicom-stream, physio-stream, eyetracking-stream, bids, fmriprep, smriprep, qsiprep,
            qsirecon, bids-study]

# --- streams (faire provides dataset_id, title, site, instrument_id, instance) ---
# The placement must match the input patterns of the bids rules:
# sourcedata/<stream>/<instance>/sub-{subject}/ses-{session}/...
item_pattern:
  type: str
  default: 'sub-(?P<subject>[A-Za-z0-9]+)_ses-(?P<session>[A-Za-z0-9]+)(?P<pilot>_pilot)?'
  help: >-
    Regex matching the name of a received item; named groups are the sample entities,
    plus optional `instrument` and `pilot`
  when: "{{ kind.endswith('-stream') }}"
instrument_from:
  type: str
  default: "{{ 'dicom' if kind == 'dicom-stream' else 'single' }}"
  choices: [dicom, name, single]
  help: >-
    How the instrument of an item is found: DICOM headers, the `instrument` group of
    item_pattern, or the stream's only instrument
  when: "{{ kind.endswith('-stream') }}"
dicom_instrument_format:
  type: str
  default: '{ManufacturerModelName}{DeviceSerialNumber}'
  help: Instrument identifier built from DICOM header fields (non-alphanumerics removed)
  when: "{{ kind.endswith('-stream') and instrument_from == 'dicom' }}"
place_format:
  type: str
  default: 'sub-{subject}/ses-{session}'
  help: Path of an item in the stream instance, from its entities
  when: "{{ kind.endswith('-stream') }}"

# --- bids (raw) ---
dicom_stream:
  type: str
  default: dicoms
  help: Stream holding the DICOMs converted by heudiconv
  when: "{{ kind == 'bids' }}"
heuristic:
  type: str
  default: code/containers/TODO/heuristic.py
  help: Heudiconv heuristic, a path inside the container collection
  when: "{{ kind == 'bids' }}"
physio_stream:
  type: str
  default: physio
  help: Stream holding physiological recordings converted by phys2bids (empty for none)
  when: "{{ kind == 'bids' }}"
phys2bids_heuristic:
  type: str
  default: code/containers/TODO/phys2bids_heuristic.py
  help: phys2bids heuristic, a path inside the container collection
  when: "{{ kind == 'bids' and physio_stream }}"
eyetrack_stream:
  type: str
  default: eyetracking
  help: Stream holding eye-tracking recordings converted by eye2bids (empty for none)
  when: "{{ kind == 'bids' }}"
eye2bids_metadata:
  type: str
  default: code/containers/TODO/eye2bids_metadata.yml
  help: eye2bids metadata file, a path inside the container collection
  when: "{{ kind == 'bids' and eyetrack_stream }}"

# --- derivatives ---
source:
  type: str
  default: "{{ 'qsiprep' if kind == 'qsirecon' else 'bids' }}"
  help: Identifier of the dataset this one is derived from
  when: "{{ kind in ['fmriprep', 'smriprep', 'qsiprep', 'qsirecon'] }}"
output_resolution:
  type: str
  default: "2"
  help: Isotropic voxel size (mm) of the preprocessed DWI
  when: "{{ kind == 'qsiprep' }}"
recon_spec:
  type: str
  default: mrtrix_multishell_msmt_ACT-hsvs
  help: qsirecon reconstruction spec (built-in name or path)
  when: "{{ kind == 'qsirecon' }}"
freesurfer_source:
  type: str
  default: smriprep
  help: Dataset providing FreeSurfer outputs for *-hsvs specs (empty for none)
  when: "{{ kind == 'qsirecon' }}"
runner:
  type: str
  default: TODO-runner
  help: CI runner tag of the processing jobs
  when: "{{ kind in ['fmriprep', 'smriprep', 'qsiprep', 'qsirecon'] }}"
